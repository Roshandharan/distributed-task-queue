name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TASKQ_REDIS_URL: redis://localhost:6379/0
      TASKQ_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (real Redis and PostgreSQL)
        run: pytest
      - name: Crash test (SIGKILL workers, wipe Redis mid-run)
        run: python -m scripts.chaos --jobs 2000 --workers 4 --kill-every 0.5 --flush-redis

  kubernetes:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskq:latest .
      - uses: helm/kind-action@v1
        with:
          cluster_name: taskq
      - name: Deploy to kind
        run: |
          kind load docker-image taskq:latest --name taskq
          kubectl apply -k k8s
          kubectl -n taskq rollout status statefulset/postgres --timeout=180s
          kubectl -n taskq rollout status deployment/redis --timeout=180s
          kubectl -n taskq rollout status deployment/api --timeout=180s
          kubectl -n taskq rollout status deployment/worker --timeout=180s
      - name: Smoke test (force-delete a worker pod mid-run)
        run: bash scripts/k8s_smoke.sh
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n taskq get pods -o wide
          kubectl -n taskq logs deployment/worker --tail=100 || true
          kubectl -n taskq logs deployment/api --tail=100 || true
