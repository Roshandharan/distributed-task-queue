apiVersion: v1
kind: ConfigMap
metadata:
  name: taskq-config
data:
  TASKQ_REDIS_URL: redis://redis:6379/0
  TASKQ_LEASE_SECONDS: "15"
  TASKQ_HEARTBEAT_SECONDS: "5"
  TASKQ_MAX_ATTEMPTS: "5"
---
# Development credentials. In a real cluster, create this Secret out of band
# (sealed-secrets, external-secrets, or your cloud's secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: taskq-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: taskq
  TASKQ_DATABASE_URL: postgresql://postgres:taskq@postgres:5432/taskq
